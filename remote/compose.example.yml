# Template only: no restart policy, resource creation, credential generation or pull.
# Select an immutable reviewed image digest; keep operational state outside this repo.
services:
  relay:
    image: "${REMOTE_PI_RELAY_IMAGE:?Set reviewed repository@sha256:digest}"
    pull_policy: never
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      REMOTEPI_RELAY_PORT: "3000"
      REMOTEPI_MESH_DB_PATH: "/data/mesh.db"
      RUST_LOG: "warn"
    volumes:
      - type: bind
        source: "${REMOTE_PI_DATA_DIR:?Set external persistent data directory}"
        target: /data
    restart: "no"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
